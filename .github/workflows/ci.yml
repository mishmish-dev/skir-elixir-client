name: Build
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Elixir ${{ matrix.elixir-version }} / OTP ${{ matrix.otp-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elixir-version: ['1.20.4']
        otp-version: ['27.3.4.18', '28.5.0.7', '29.1.1']
        include:
          - elixir-version: '1.18.4'
            otp-version: '27.3.4.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}
          version-type: strict
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked
      - name: Runtime unit tests, RPC oracle and Hex consumer
        run: npm run test:all
      - name: Build documentation
        run: mix docs --warnings-as-errors
      - name: Preserve documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-otp-${{ matrix.otp-version }}-elixir-${{ matrix.elixir-version }}
          path: doc/
          if-no-files-found: error
      - name: Preserve test reports and package archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-otp-${{ matrix.otp-version }}-elixir-${{ matrix.elixir-version }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
