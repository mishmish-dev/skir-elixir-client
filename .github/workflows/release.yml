name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -e 'console.log(require("fs").readFileSync("mix.exs", "utf8").match(/version:\s*"([^"]+)"/)[1])')
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            test "$RELEASE_TAG" = "v$version" || { echo '::error::Release tag must match mix.exs version (vX.Y.Z)'; exit 1; }
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  hex:
    needs: checks
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.1'
          version-type: strict
      - name: Prepare native runtime
        env:
          MIX_ENV: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Verify documentation before publishing
        run: |
          mix deps.get --check-locked
          mix docs --warnings-as-errors
      - name: Publish Hex runtime
        env:
          MIX_ENV: prod
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY" || { echo '::error::Missing HEX_API_KEY publishing secret'; exit 1; }
          mix hex.publish package --dry-run --yes
          mix hex.publish package --yes
      - name: Publish HexDocs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes
