name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Validate release version
        id: version
        run: |
          version=$(node -e 'console.log(require("fs").readFileSync("mix.exs", "utf8").match(/version:\s*"([^"]+)"/)[1])')
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Run Release from main'; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Version must be X.Y.Z'; exit 1; }
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          changed=true
          if [ "$last_tag" = "v$version" ]; then changed=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Version: $version; latest release tag: ${last_tag:-none}; changed: $changed" >> "$GITHUB_STEP_SUMMARY"
  checks:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  hex:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.1'
          version-type: strict
      - name: Prepare native runtime
        env:
          MIX_ENV: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Verify documentation before publishing
        run: |
          mix deps.get --check-locked
          mix docs --warnings-as-errors
      - name: Publish Hex runtime
        env:
          MIX_ENV: prod
          HEX_API_KEY: ${{ secrets.HEX_API_TOKEN }}
        run: |
          test -n "$HEX_API_KEY" || { echo '::error::Missing HEX_API_TOKEN publishing secret'; exit 1; }
          mix hex.publish package --dry-run --yes
          mix hex.publish package --yes
      - name: Publish HexDocs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_TOKEN }}
        run: mix hex.publish docs --yes
  github-release:
    needs: [validate, hex]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$GITHUB_SHA"
          gh release create "v$RELEASE_VERSION" --verify-tag \
            --title "skir_elixir_client v$RELEASE_VERSION" --generate-notes
